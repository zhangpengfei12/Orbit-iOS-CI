<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Orbit</title>
<link rel="stylesheet" href="/css/common.css?v=20261010a">
<link rel="stylesheet" href="/css/player.css?v=20261010a">
<link rel="stylesheet" href="/css/cyber-base.css?v=20261010a">
<link rel="stylesheet" href="/css/buttons.css?v=20261010a">
</head>
<body>

<div id="container">
    <div class="topbar" id="topbar">
        <a href="/"><span class="back-arrow">&larr;</span> 返回</a>
        <!-- 一键冲刺：只给脚本驱动的 L0 主轴加速；旋转/俯卧补偿等其它轴按原速继续。
             放在顶栏「返回」右侧而不是右边 —— 右上角是同步胶囊 .sync 的地盘，会压住按钮。 -->
        <div class="topbar-actions">
            <button class="topbar-btn" id="dashBtn" type="button" title="一键冲刺：点一下进档位 1（120 次/分），再点档位 2 / 3，第 4 下关闭">冲刺</button>
        </div>
        <div class="title" id="videoTitle"></div>
    </div>
    <div class="sync" id="sync">
        <div class="sync-dot wait" id="syncDot"></div>
        <span id="syncText">等待同步</span>
        <div class="sync-axes" id="syncAxes"></div>
    </div>

    <!-- OSR 诊断面板：展开后看连接方式、目标地址、最后发送指令/错误，定位「轴同步中但设备不动」 -->
    <div class="osr-debug" id="osrDebug">
        <button class="osr-debug-toggle" id="osrDebugToggle" type="button">▸ 设备诊断</button>
        <div class="osr-debug-body" id="osrDebugBody" style="display:none">
            <div class="osr-debug-row"><b>链路:</b> <span id="osrDbgLink">-</span></div>
            <div class="osr-debug-row"><b>目标:</b> <span id="osrDbgTarget">-</span></div>
            <div class="osr-debug-row"><b>T-Code:</b>
                <select id="osrDbgVersion" class="osr-debug-select">
                    <option value="V2">V2 (L05000)</option>
                    <option value="V3">V3 (L05000I800)</option>
                </select>
                <span id="osrDbgVersionStatus"></span>
            </div>
            <div class="osr-debug-row"><b>脚本:</b> <span id="osrDbgHasScript">-</span></div>
            <div class="osr-debug-row"><b>时长:</b> <span id="osrDbgDur">-</span></div>
            <div class="osr-debug-row"><b>时钟:</b> <span id="osrDbgClock">-</span></div>
            <div class="osr-debug-row"><b>当前时刻:</b> <span id="osrDbgCurMs">-</span></div>
            <div class="osr-debug-row"><b>最后发送:</b> <span id="osrDbgCmd">-</span></div>
            <div class="osr-debug-row"><b>原始字节:</b> <span id="osrDbgRaw">-</span></div>
            <div class="osr-debug-row"><b>发送错误:</b> <span id="osrDbgErr">-</span></div>
            <div class="osr-debug-row"><b>当前位置:</b> <span id="osrDbgPos">-</span></div>
            <button class="osr-debug-test" id="osrDebugTest" type="button">测试设备（发送 0→9999）</button>
            <div class="osr-debug-result" id="osrDbgResult"></div>
        </div>
    </div>

    <!-- 顶部时间胶囊：播放进度时间改到这里显示（未全屏时下方按钮行信息太多会挤爆），
         id 沿用 curTime / durTime（player.js 的更新逻辑不必改），仅 DOM 位置移到播放器上方。 -->
    <div class="ptime" id="ptime"><span id="curTime">00:00</span><i>/</i><span id="durTime">00:00</span></div>

    <video id="video" playsinline></video>
    <!-- 手机盒子 VR 模式：WebGL 全景/影院渲染画布（默认隐藏，进入 VR 时显示） -->
    <canvas id="vrCanvas"></canvas>

    <!-- HEVC/H.265 等不支持编码的提示层：内置播放器无法解码时给出明确原因和系统播放器兜底 -->
    <div id="codecBlock" class="codec-block" style="display:none">
        <div class="codec-box">
            <div class="codec-title">当前视频无法在内置播放器播放</div>
            <div class="codec-info" id="codecInfo">检测到不兼容的视频编码格式。</div>
            <div class="codec-cap" id="codecCap" style="display:none"></div>
            <div class="codec-actions">
                <button class="codec-btn primary" id="codecOpenBtn" type="button">用系统播放器打开</button>
                <button class="codec-btn" id="codecRetestBtn" type="button">重新探测设备能力</button>
                <button class="codec-btn" id="codecBackBtn" type="button">返回</button>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-tooltip" id="tooltip">00:00</div>
        </div>
        <div class="btn-row">
            <button class="btn" id="back15Btn" title="快退 15 秒" aria-label="快退 15 秒">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="16.7" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none">15</text></svg>
            </button>
            <button class="btn" id="playBtn" title="播放/暂停">
                <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="btn" id="fwd15Btn" title="快进 15 秒" aria-label="快进 15 秒">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" transform="translate(24,0) scale(-1,1)"/><text x="12" y="16.7" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none">15</text></svg>
            </button>
            <div class="spacer"></div>
            <div class="vol-wrap">
                <button class="btn" id="volBtn" title="静音">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1">
            </div>
            <button class="btn" id="vrBtn" title="手机盒子 VR 模式">
                <svg viewBox="0 0 24 24"><path d="M21 7H3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-1.5 2 2 0 0 1 4 0 2 2 0 0 0 2 1.5h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM7 13H5v-2h2zm12 0h-2v-2h2z"/></svg>
            </button>
            <!-- VR 播放模式（FLAT / 分屏 / 180° / 360° 等）：VR 盒子模式与独立播放页可见 -->
            <button class="btn vr-proj-btn" id="vrProjBtn" title="VR 播放模式">FLAT</button>
            <!-- 播放模式：单曲循环 / 顺序播放 / 随机播放。列表由视频库页 postMessage 传入，
                 独立播放页（没有列表）时顺序与随机不可用，会自动退回单曲循环。 -->
            <button class="btn mode-btn" id="playModeBtn" title="播放模式">顺序</button>
            <button class="btn rate-btn" id="rateBtn" title="倍速">1×</button>
            <button class="btn" id="fsBtn" title="全屏">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
            <!--「更多」：窄屏（按钮行实测放不下）时主行会折叠掉音量/播放模式/VR 播放模式，
                 这些入口改由这里收纳，功能不丢。面板跟着控制栏一起淡入淡出。 -->
            <button class="btn more-btn" id="moreBtn" title="更多设置">
                <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
            </button>
        </div>

        <div class="more-sheet" id="moreSheet">
            <div class="more-vol">
                <span class="more-label">音量</span>
                <!-- 滑块节点由 player.js 从主行搬到这里（同一节点，事件绑定不丢） -->
                <div class="more-vol-wrap" id="moreVolWrap"></div>
            </div>
            <div class="more-grid">
                <button class="more-item" id="moreModeBtn" type="button">循环</button>
                <button class="more-item" id="moreRateBtn" type="button">1×</button>
                <button class="more-item" id="moreVrBtn" type="button">FLAT</button>
            </div>
        </div>
    </div>

    <!-- VR 模式工具栏（默认隐藏，轻点屏幕唤出） -->
    <div id="vrToolbar" class="vr-toolbar">
        <button class="vr-btn" id="vrModeBtn" title="选择 VR 播放模式">球面</button>
        <button class="vr-btn" id="vrCamBtn" title="切换陀螺仪 / 触摸拖动">陀螺仪</button>
        <button class="vr-btn" id="vrDistBtn" title="切换桶形畸变强度">畸变·中</button>
        <button class="vr-btn" id="vrExitBtn" title="退出 VR 模式">退出</button>
    </div>
    <!-- VR 模式居中对齐参考线 -->
    <div id="vrGuide" class="vr-guide"></div>

    <!-- VR 播放模式选择浮层：控制栏按钮与 VR 工具栏按钮共用（列表项由 player.js 生成） -->
    <div id="vrProjSheet" class="vr-proj-sheet">
        <div class="vr-proj-mask" data-vrclose></div>
        <div class="vr-proj-box">
            <div class="vr-proj-head">
                <span class="vr-proj-title">VR 播放模式</span>
                <button class="vr-proj-x" type="button" data-vrclose aria-label="关闭">✕</button>
            </div>
            <div class="vr-proj-list" id="vrProjList"></div>
        </div>
    </div>

    <!-- 脚本编辑覆盖层：只在 ?manualrec=1 时显示 -->
    <!-- 倍速 / 范围设置平铺在顶栏（用户要求不再用弹窗）：两行排版 —— 第一行「返回 + 录制按钮」，
         第二行「倍速 + 范围」，避免横屏下所有控件挤在一排互相压字。 -->
    <div id="mrOverlay" class="mr-overlay" style="display:none">
        <div class="mr-topbar">
            <div class="mr-topbar-row">
                <button id="mrBack" class="mr-back" type="button">&larr; 返回</button>
                <button id="mrRecToggle" class="mr-rec-btn" type="button">&#9679; 录制</button>
            </div>
            <div class="mr-topbar-row mr-topbar-row-tools">
                <div class="mr-pills mr-topbar-pills" id="mrSpeeds">
                    <button class="mr-pill" data-rate="0.25" type="button">0.25x</button>
                    <button class="mr-pill" data-rate="0.5" type="button">0.5x</button>
                    <button class="mr-pill" data-rate="0.75" type="button">0.75x</button>
                    <button class="mr-pill active" data-rate="1" type="button">1x</button>
                </div>
                <div class="mr-pills mr-topbar-pills" id="mrRanges">
                    <button class="mr-pill active" data-range="full" type="button">全片</button>
                    <button class="mr-pill" data-range="tail" type="button">当前位置到结束</button>
                </div>
            </div>
        </div>
        <div class="mr-slider" id="mrSlider">
            <div class="mr-slider-label">L0</div>
            <div class="mr-slider-val" id="mrSliderVal">50%</div>
            <div class="mr-slider-track"><div class="mr-slider-fill" id="mrSliderFill"></div></div>
        </div>
        <!-- 底部一条：波形（录制轨迹红线）与录制时间并排，波形吃掉剩下的宽度 -->
        <div class="mr-botbar">
            <canvas id="mrWave" class="mr-wave" width="300" height="64"></canvas>
            <div class="mr-recinfo">
                <span class="mr-rec-dot" id="mrRecDot"></span>
                <span id="mrRecTime">00:00</span>
            </div>
        </div>
    </div>
</div>

<!-- 脚本编辑：保存弹窗 -->
<div id="mrSave" class="mr-modal" style="display:none">
    <div class="mr-modal-box">
        <div class="mr-modal-title">保存脚本</div>
        <div class="mr-form">
            <label>脚本名称</label>
            <input type="text" id="mrSaveName" class="mr-input" placeholder="脚本编辑_20260930_1200">
            <p class="mr-save-hint" id="mrSaveHint">将保存到视频所在文件夹（与视频同名即可随播自动加载）</p>
        </div>
        <div class="mr-modal-actions">
            <button class="mr-btn" id="mrCancelSave" type="button">取消</button>
            <button class="mr-btn" id="mrDiscard" type="button">丢弃</button>
            <button class="mr-btn primary" id="mrDoSave" type="button">保存</button>
        </div>
    </div>
</div>

<!-- 脚本编辑：轻提示 -->
<div id="mrToast" class="mr-toast" style="display:none"></div>

<script src="/js/custom-select.js?v=20261010a"></script>
<script src="/js/license.js?v=20261010a"></script>
<!-- 试用 / 卡密激活：必须早于 player.js，守卫才能在播放点击之前生效 -->
<script src="/js/player.js?v=20261010a"></script>
</body>
</html>
