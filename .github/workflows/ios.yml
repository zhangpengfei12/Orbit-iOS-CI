name: iOS

# 设计原则：iOS 开发绝不影响安卓。
#   1) 只在 ios 分支 / main 的 ios|web 路径下触发，安卓代码不参与
#   2) 共享层 web/ 每次都要过安卓回归（web-regression job），改坏了立刻红
#   3) 编译验证（compile-check）不依赖任何签名 Secrets，证书没到位也能先验证代码能不能编
#
# ⚠ 注意：GitHub 不允许在 job 级 `if` 里用 secrets 上下文（只认 github/needs/vars/inputs），
#   写了会直接 "Unrecognized named-value: 'secrets'" 启动失败。
#   所以归档 job 的「Secrets 齐备才跑」判断下沉到 step 级（step 级 if/env 可以用 secrets）。
on:
  push:
    branches: [ios, main]
    paths:
      - 'ios/**'
      - 'web/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 是否上传到 TestFlight
        type: boolean
        default: false

jobs:
  # ---------- 1. 共享层守护：web/ 是安卓与 iOS 共用的，改坏就是两边一起坏 ----------
  web-regression:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JS 语法校验（全量）
        run: |
          fail=0
          # 注意：必须用进程替换 < <(find ...)，不能用管道 —— 管道里的 while 是子壳，
          # 子壳里 fail=1 传不出来，会让语法校验永远绿灯。
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done < <(find web -name "*.js" -print0)
          exit $fail
      # 安卓回归断言（license_check.py）依赖 app/src 下的 Kotlin 源码，
      # 本镜像仓库为纯净版（不含安卓商业代码），故不执行该步骤；
      # 该守卫仍在私有主仓库的同名 workflow 中运行。

  # ---------- 2. 编译验证：不需要任何证书，第一轮就能跑 ----------
  compile-check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 固定 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成 Xcode 工程
        run: cd ios && xcodegen generate
      - name: 编译（关闭签名，纯验证代码）
        run: |
          cd ios
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: ~/Library/Logs/**/*.log
          if-no-files-found: ignore

  # ---------- 3. 归档 + 上传 TestFlight：签名 Secrets 齐备才执行各步骤 ----------
  archive-upload:
    needs: [web-regression, compile-check]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # ⚠ 必须用 Xcode 26+：Apple 强制「iOS 26 SDK or later」才能上传 App Store Connect，
      #   用 Xcode 16.4（iOS 18.5 SDK）归档上传会被判
      #   "SDK version issue. This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps
      #    must be built with the iOS 26 SDK or later..."。
      # 且 GitHub Actions runner 会设 DEVELOPER_DIR 环境变量，优先级高于 xcode-select，
      # 故「切换 Xcode 版本」必须通过显式设置 DEVELOPER_DIR（本 job 级 env）才生效。
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: 检查签名凭证是否齐备
        id: sig
        env:
          HAS_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$HAS_P12" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名 Secrets（IOS_CERT_P12_BASE64 等），本 job 全部步骤跳过。"
          fi
      - name: 固定 Xcode 版本
        if: steps.sig.outputs.ready == 'true'
        run: |
          # 选用 Xcode 26.3 的原因：Apple 要求上传包必须用 iOS 26 SDK（Xcode 26+）构建。
          # 此前用 16.4 归档虽能成功，上传必被 "SDK version issue" 拒。
          # 之前 26.3 报 "Profile is missing the required UUID property" 是旧格式 profile 所致，
          # 现 profile（Orbit App Store CI）已换新，26.3 可正常加载。
          # 手动签名（Manual）+ App Store 分发 profile 不依赖设备，正好用于 TestFlight。
          xcodebuild -version
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
      - name: 安装 XcodeGen
        if: steps.sig.outputs.ready == 'true'
        run: brew install xcodegen
      - name: 生成 Xcode 工程
        if: steps.sig.outputs.ready == 'true'
        run: cd ios && xcodegen generate
      - name: 诊断：工程是否真的把 Orbit/Info.plist 设为 INFOPLIST_FILE
        if: steps.sig.outputs.ready == 'true'
        run: |
          cd ios
          echo "=== 工程里的 Info.plist 文件 ==="
          find . -name "Info.plist" 2>/dev/null | head -10
          echo "=== 构建设置（Info.plist / 版本号）==="
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Release \
            -destination generic/platform=iOS \
            -showBuildSettings 2>/dev/null \
            | grep -iE "^\s*(INFOPLIST_FILE|GENERATE_INFOPLIST_FILE|INFOPLIST_KEY|PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|INFOPLIST_OTHER_PREPROCESSOR)" | head -30
      # ⚠ 不要用 agvtool new-version：它会**重写** Orbit/Info.plist（把 $(CURRENT_PROJECT_VERSION)
      #   改成字面量），实测重写后产物 Info.plist 只剩 Xcode 自动生成的键，
      #   UISupportedInterfaceOrientations / UILaunchScreen / 隐私描述 全部丢失，
      #   被 Apple 判 "No orientations were specified"。
      #   build 号改为直接以构建设置 CURRENT_PROJECT_VERSION 传给 xcodebuild（见归档步骤）。
      - name: 诊断：build 号来源
        if: steps.sig.outputs.ready == 'true'
        run: |
          cd ..
          echo "build 号 = $(git rev-list --count HEAD)"

      - name: 导入签名证书与描述文件（手动签名）
        if: steps.sig.outputs.ready == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          # 1) 导入 Apple Distribution 证书 + 私钥（手动签名时 Xcode 需本地持有签名身份）
          echo -n "$P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"
          # 2) 解码 App Store Connect API Key（p8）—— 仅上传 TestFlight 步骤（apple-actions）需要
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_P8_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "已写入 AuthKey_${ASC_KEY_ID}.p8"
          # 3) 手动放置 App Store 分发 profile（按 UUID 命名）。
          #    任何 Xcode 版本都读得懂这份传统格式 profile；之前加载失败是信任链缺中间证书，
          #    已由「补 Apple CA 证书」步骤修复。
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          TMP_PROFILE="$RUNNER_TEMP/orbit.mobileprovision"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$TMP_PROFILE"
          if ! security cms -D -i "$TMP_PROFILE" >/dev/null 2>&1; then
            echo "!! 还原出的描述文件无法被 security 解析（secret 内容或 decode 损坏）"; exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$TMP_PROFILE" 2>/dev/null | grep -A1 '<key>UUID' | tail -1 | sed -E 's/.*<string>([^<]*)<\/string>.*/\1/' | tr -d ' \t\r\n')
          if [ -z "$PROFILE_UUID" ]; then echo "!! 取 UUID 失败"; exit 1; fi
          echo "profile-UUID: $PROFILE_UUID"
          cp "$TMP_PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "已放置 profile: $PROFILE_UUID.mobileprovision"

      - name: 补 Apple CA 证书到系统钥匙串（profile 验签需要，runner 默认缺中间证书）
        if: steps.sig.outputs.ready == 'true'
        run: |
          set -e
          KC=/Library/Keychains/System.keychain
          # profile 签名链：Apple iPhone OS Provisioning Profile Signing
          #   -> Apple iPhone Certification Authority（中间证书，runner 默认没有）
          #   -> Apple Root CA（2006 根，系统一般已信任）
          # Xcode 校验 profile 时必须能在钥匙串里找到这条链；缺中间证书即报
          # "Profile is missing the required UUID property"。下面把两个证书补进 System.keychain。

          # 1) Apple iPhone Certification Authority（中间证书）
          IPHONE_CA_B64=""
          echo -n "$IPHONE_CA_B64" | base64 --decode -o /tmp/AppleiPhoneCA.cer
          if ! sudo security find-certificate -c "Apple iPhone Certification Authority" "$KC" >/dev/null 2>&1; then
            echo "系统缺 Apple iPhone Certification Authority，安装中间证书"
            sudo security add-certificates -k "$KC" /tmp/AppleiPhoneCA.cer
          else
            echo "系统已含 Apple iPhone Certification Authority"
          fi

          # 2) Apple Root CA（2006 根；若系统信任库未含则补为信任根，确保链能落到信任锚）
          ROOT_CA_B64=""
          echo -n "$ROOT_CA_B64" | base64 --decode -o /tmp/AppleRootCA.cer
          if ! sudo security find-certificate -c "Apple Root CA" "$KC" >/dev/null 2>&1; then
            echo "系统缺 Apple Root CA，安装为信任根"
            sudo security add-trusted-cert -d -r trustRoot -k "$KC" /tmp/AppleRootCA.cer
          else
            echo "系统已含 Apple Root CA"
          fi

          echo "=== 系统钥匙串中的 Apple 证书（诊断）==="
          sudo security find-certificate -c "Apple" -a "$KC" 2>/dev/null | grep -E '"alis"|"subj"' | head -30 || echo "(查询失败)"

      - name: 诊断（Xcode 版本 / 可用 Xcode / 手动签名解析出的设置）
        if: steps.sig.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          echo "=== 当前 Xcode ==="; xcodebuild -version
          echo "=== 可用 Xcode ==="; ls /Applications/ | grep -i xcode || true
          echo "=== 手动签名：让 Xcode 用已放置的 App Store 分发 profile 解析设置 ==="
          cd ios && xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -showBuildSettings 2>&1 | grep -iE "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER" | head -20 || true

      - name: 归档
        if: steps.sig.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cd ios
          # build 号自增（TestFlight 只要求单调递增）：用 git 提交数，
          # 经构建设置 CURRENT_PROJECT_VERSION 注入 Info.plist 的 $(CURRENT_PROJECT_VERSION)。
          BUILD_NUM=$(git -C .. rev-list --count HEAD)
          echo "CURRENT_PROJECT_VERSION=$BUILD_NUM"
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Release \
            -destination generic/platform=iOS \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      # ⚠ 兜底：Xcode 26 + XcodeGen 实测完全忽略 INFOPLIST_FILE（GENERATE=NO/YES 都试过，产物 plist
      #   始终是 Xcode 自动生成版，自定义键全丢、被 Apple 判 "No orientations were specified"）。
      #   根因不在 plist 内容，而在 XcodeGen 生成的工程不吃这个文件。故 archive 之后、export 之前，
      #   用 PlistBuddy 把必需键直接写进已构建 app 的 Info.plist（exportArchive 会重新签名，随包生效）。
      - name: 兜底注入 Info.plist 必需键（XcodeGen 不吃 INFOPLIST_FILE 的 workaround）
        if: steps.sig.outputs.ready == 'true'
        run: |
          APP="$RUNNER_TEMP/Orbit.xcarchive/Products/Applications/Orbit.app"
          PB=/usr/libexec/PlistBuddy
          has(){ $PB -c "Print :$1" "$APP/Info.plist" >/dev/null 2>&1; }
          add_str(){ if ! has "$1"; then $PB -c "Add :$1 string '$2'" "$APP/Info.plist"; fi; }
          add_bool(){ if ! has "$1"; then $PB -c "Add :$1 bool $2" "$APP/Info.plist"; fi; }
          add_arr(){ if ! has "$1"; then
              $PB -c "Add :$1 array" "$APP/Info.plist"
              for v in "${@:2}"; do $PB -c "Add :$1: string $v" "$APP/Info.plist"; done
            fi; }
          add_dict(){ if ! has "$1"; then $PB -c "Add :$1 dict" "$APP/Info.plist"; fi; }

          add_str CFBundleDisplayName "Orbit"
          add_str UIUserInterfaceStyle "Dark"
          add_arr UISupportedInterfaceOrientations \
            UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown \
            UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
          add_dict UILaunchScreen
          add_dict NSAppTransportSecurity
          if ! $PB -c "Print :NSAppTransportSecurity:NSAllowsLocalNetworking" "$APP/Info.plist" >/dev/null 2>&1; then
            $PB -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP/Info.plist"
          fi
          add_str NSBluetoothAlwaysUsageDescription "用于连接并控制已配对的硬件设备"
          add_str NSLocalNetworkUsageDescription "用于通过局域网连接设备，以及访问局域网内的媒体共享"
          add_bool UIFileSharingEnabled true
          add_bool UIViewControllerBasedStatusBarAppearance true
          add_bool LSRequiresIPhoneOS true
          echo "=== 注入后产物 Info.plist 关键键 ==="
          plutil -p "$APP/Info.plist" 2>/dev/null | grep -E "UISupportedInterfaceOrientations|UILaunchScreen|NSBluetoothAlwaysUsageDescription|CFBundleDisplayName|UIUserInterfaceStyle|NSAppTransportSecurity"

      - name: 诊断构建产物（app bundle 里真正的 Info.plist / 图标）
        if: steps.sig.outputs.ready == 'true'
        run: |
          APP="$RUNNER_TEMP/Orbit.xcarchive/Products/Applications/Orbit.app"
          echo "=== app bundle 内容 ==="
          ls -la "$APP" | head -30
          echo ""
          echo "=== 产物 Info.plist 全量键值 ==="
          plutil -p "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist"
          echo ""
          echo "=== 图标产物 ==="
          ls -la "$APP/AppIcon60x60@2x.png" "$APP/AppIcon76x76@2x.png" 2>/dev/null \
            | head -5 || echo "(未在同路径找到图标，正常：actool 会把 PNG 打到根目录或 Assets.car)"
          find "$APP" -name "AppIcon*" -maxdepth 2 | head -10 || true
          echo ""
          echo "=== 断言：产物必须含自定义键（否则 Apple 会拒）==="
          fail=0
          for k in UISupportedInterfaceOrientations UILaunchScreen NSBluetoothAlwaysUsageDescription CFBundleDisplayName; do
            if ! plutil -p "$APP/Info.plist" 2>/dev/null | grep -q "$k"; then
              echo "!! 缺失关键键: $k"; fail=1
            else
              echo "  ok: $k"
            fi
          done
          # 版本号必须来自 build 设置（1.0.0 + 真实 build 号），不能是 Xcode 默认 1.0/1
          VER=$(plutil -p "$APP/Info.plist" 2>/dev/null | grep CFBundleShortVersionString | sed -E 's/.*=> "([^"]*)".*/\1/')
          BND=$(plutil -p "$APP/Info.plist" 2>/dev/null | grep CFBundleVersion | sed -E 's/.*=> "([^"]*)".*/\1/')
          echo "CFBundleShortVersionString=$VER  CFBundleVersion=$BND"
          if [ "$VER" != "1.0.0" ]; then echo "!! 版本号异常（期望 1.0.0，实际 $VER）"; fail=1; fi
          if [ "$fail" = "1" ]; then echo "产物 Info.plist 校验失败，终止。"; exit 1; fi
          echo "产物 Info.plist 校验通过。"

      - name: 生成 ExportOptions
        if: steps.sig.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.niuniu.orbit</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: 导出 ipa
        if: steps.sig.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # 只上传，不提交 App Store 审核 —— 我们的诉求就是只上 TestFlight
      # 注意：apple-actions/upload-testflight-build 的输入名是 issuer-id（不是 api-issuer-id），
      # 且 api-private-key 必须传原始 PEM（不是 base64），Action 会把它写到 $HOME/private_keys/ 再调 altool。
      - name: 上传 TestFlight
        if: steps.sig.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/ipa/Orbit.ipa
          app-type: ios
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          api-private-key: ${{ secrets.ASC_API_KEY_P8 }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.sig.outputs.ready == 'true'
        with:
          name: Orbit-ipa
          path: ${{ runner.temp }}/ipa/Orbit.ipa
          if-no-files-found: ignore
