# XcodeGen 工程描述：CI 里 `brew install xcodegen && xcodegen generate` 生成 Orbit.xcodeproj
# 不手写 project.pbxproj —— 在 Windows 上无法验证，出错代价太高。
name: Orbit

options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    iOS: "16.0"
  groupOrdering:
    - order: [Orbit, Resources, Frameworks]

settings:
  # iOS 版本线独立于安卓：安卓走 2.7.x，iOS 从 1.0.x 起步。
  # 这样 iOS 迭代不会污染安卓的 versionCode / changelog，也不会误触发安卓发版。
  # build 号由 CI 用 git rev-list --count HEAD 自增（TestFlight 只要求单调递增）。
  MARKETING_VERSION: 1.0.1
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1,2"

packages:
  # ⚠ 原先用 GCDWebServer，但它 2022 年已归档且**没有 Package.swift**（不支持 SwiftPM），
  #   CI 报 "no versions of 'gcdwebserver' match"。改用 Swifter：纯 Swift、无传递依赖、
  #   Package.swift 无平台限制（iOS 可用）。
  Swifter:
    url: https://github.com/httpswift/swifter
    from: "1.5.0"
  # SMB 网络共享：AMSMB2 是 libsmb2（C，LGPL v2.1）的 Swift 封装，支持 SMB2/SMB3。
  # ⚠⚠ 关键修复（build 43 真机一开即退回桌面根因）：上游 AMSMB2 的 product 声明为
  #   `.library(type: .dynamic)`，会在主可执行文件里塞一条 LC_LOAD_DYLIB 硬依赖，
  #   dyld 启动时必须加载 AMSMB2.framework。实测该动态框架在「归档后手改 bundle +
  #   exportArchive 重新签名」的链路下，真机启动直接 dyld 失败 → 进不了首页。
  #   修复：ios.yml 在 xcodegen 之前把源码 clone 到 ios/ci_vendor/AMSMB2 并 sed 把
  #   product 改写成 `.static`（见 ios.yml 的「本地化 AMSMB2」步骤），改为静态链接 ——
  #   不再有独立的 AMSMB2.framework，彻底消除动态框架启动崩溃。
  #   备注：iOS App Store 分发下「动态链接以满足 LGPL」本就形同虚设（设备无法重链接），
  #   静态链接 + 开源源码随附是符合 LGPL 的通行做法。上游 Package.swift 实际是
  #   swift-tools-version 5.6（非注释旧记的 6.0），Xcode 26 可正常解析。
  # ⚠ 本地路径：本机 Windows 不参与构建（也无外网），CI runner 有外网，由 ios.yml 注入源码。
  AMSMB2:
    path: ci_vendor/AMSMB2

targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
    resources:
      # ⚠ build 23 黑屏根因：folder reference 指向工程外路径（../web）时，
      #   Xcode 26 新构建系统归档会产出**空的 web 目录**（目录在、文件全丢），
      #   真机诊断确认 bundle 内 web/ 顶层条目为空。
      #   修复：CI 在 xcodegen generate 之前把 ../web 拷进工程内 WebResources/web
      #   （见 ios.yml 的「拷贝 web 资源进工程内」步骤），folder reference 改指工程内路径。
      #   本地生成前也要先执行：mkdir -p WebResources && cp -R ../web WebResources/web
      - path: WebResources/web
        type: folder
        buildPhase: resources
      # 隐私清单：不声明 UserDefaults 等「必需理由 API」，构建会被判 Invalid
      - path: Orbit/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Orbit/Info.plist
      # ⚠ 关键经验（踩坑三连后定论）：本构建里 Xcode 26 会忽略 INFOPLIST_FILE 作为「主 plist」
      #   （GENERATE_INFOPLIST_FILE=NO 时产物 plist 退回 Xcode 自动生成、版本号 1.0、自定义键全丢，
      #   被 Apple 判 "No orientations were specified"）。
      #   正确做法：GENERATE_INFOPLIST_FILE=YES —— Xcode 生成基础 plist 后，把 Orbit/Info.plist
      #   当作「附加内容」合并进去（与 asset catalog 生成的 CFBundleIcons 走同一合并通道，可靠进包）。
      #   故 Orbit/Info.plist 里写全部自定义键（方向/启动屏/隐私描述/ATS/UIUserInterfaceStyle 等）。
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.niuniu.orbit
      GENERATE_INFOPLIST_FILE: "YES"
      INFOPLIST_FILE: Orbit/Info.plist
      # ⚠ 手动签名的分发 profile **只能写在本 target 的构建设置里**，绝不能放 xcodebuild 命令行。
      #   命令行构建设置会传播到 SwiftPM 生成的包 project（AMSMB2 等），而框架类包 target
      #   不支持 profile，会直接报
      #     "AMSMB2 does not support provisioning profiles. ... Set the provisioning profile
      #      value to \"Automatic\" in the build settings editor."
      #   而包 project 是 Xcode 在 DerivedData 里生成的，改不了它的设置 —— 只能从源头别把
      #   profile 传过去。写在本 target 里则只影响 Orbit.app，包 target 不受影响。
      #
      #   真实 profile 名是 Secret，不能写死进仓库，故用一层用户自定义构建设置做间接：
      #   CI 传 `xcodebuild ... ORBIT_PROFILE_NAME="Orbit App Store CI"`，这里展开取用；
      #   本地构建不传时展开为空串 = Automatic，也不会报错。
      PROVISIONING_PROFILE_SPECIFIER: $(ORBIT_PROFILE_NAME)
      # 显式声明 AppIcon 集合名，确保 asset catalog 被编译、图标真正进包
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Swifter
        product: Swifter
      # 静态库产品（见 packages 处说明）：已本地化改写为 .static，链接进 app 主程序，
      # 无独立 .framework、无 Embed 阶段 —— 这正是消除 build 43 dyld 启动崩溃的关键。
      - package: AMSMB2
        product: AMSMB2
